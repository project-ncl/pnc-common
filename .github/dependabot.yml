# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "org.jboss.da:*"
        - "org.jboss.pnc*:*"        # match org.jboss.pnc:xyz and org.jboss.pnc.group:xyz
    ignore:
      # hibernate-validator 7.x+ switched from javax.* (Bean Validation 2.0) to jakarta.*
      # (Jakarta Bean Validation 3.0+), which is binary-incompatible with JBoss EAP 7.4's
      # runtime (providing Hibernate Validator 6.x and Java EE 8 javax.validation-api).
      # The safe ceiling is 6.2.x (latest: 6.2.6.Final).
      # Remove this exclusion when the project is upgraded/migrated to EAP 8 / Jakarta EE 10.
      - dependency-name: "org.hibernate.validator:hibernate-validator"
        versions: [ "[7,)" ]

  - package-ecosystem: "github-actions" # Also update Github actions
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "project-ncl/shared-github-actions/*"
